name: Claude Code

on:
  issues:
    types: [opened]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Dw number from issue title
        id: extract_dw
        run: |
          TITLE="${{ github.event.issue.title }}"
          # Dw-123 のような形式から抽出（大文字小文字区別なし）
          DW_NUM=$(echo "$TITLE" | grep -oiP '^Dw-\d+' | tr '[:upper:]' '[:lower:]')
          if [ -z "$DW_NUM" ]; then
            echo "dw_branch=issue-${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "dw_branch=$DW_NUM" >> $GITHUB_OUTPUT
          fi

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: "master"
          branch_prefix: "feature/"
          branch_name_template: "${{ steps.extract_dw.outputs.dw_branch }}"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}

            このissueに対応するため、以下の手順を行ってください
            ### ステップ1: 事前準備
            1. Issue タスク情報の取得
              - ページ詳細とコンテンツを取得して構造化された情報を表示
            2. docs/feature/dw-{タスクID}/summary.md を作成し、Issueのタスク情報を転記する
              - Writeツールを使ってファイルを作成すると、ディレクトリも自動的に作成されます

            ### ステップ2: 実装計画
            1. 以下のドキュメントを確認する
              - docs/development/SYSTEM_DESIGN.md
              - docs/development/EXCEPTION_DESIGN.md
              - docs/development/CODING_STANDARDS.md
            2. planモードにて実装計画を立ててください。曖昧な点があれば、質問はせずに仮定して進めてください。そしてplan.mdの最後に曖昧な点は記載してください。
              - docs/feature/dw-{タスクID}/plan.md に作成する
            3. plan-reviewer.mdのエージェントを使い、実装計画のレビューをしてください。
            4. plan-reviewer.mdのレビュー内容を踏まえて、plan.mdを修正してください。

            ### ステップ3: PR作成（/create-pr command）
            .claude/commands/pull-request.mdに従ってPR作成：

            **重要な注意事項：**
            - plan.mdとsummary.mdを必ずコミットに含めること
            - セキュリティチェック（XSS対策など）を必ず実施
          claude_args: '--allowed-tools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh:*)"'