name: Claude Code

on:
  issues:
    types: [opened]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Dw number from issue title
        id: extract_dw
        run: |
          TITLE="${{ github.event.issue.title }}"
          # Dw-123 のような形式から抽出（大文字小文字区別なし）
          DW_NUM=$(echo "$TITLE" | grep -oiP '^Dw-\d+' | tr '[:upper:]' '[:lower:]')
          if [ -z "$DW_NUM" ]; then
            echo "dw_branch=issue-${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "dw_branch=$DW_NUM" >> $GITHUB_OUTPUT
          fi

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: "main"
          branch_prefix: "feature/"
          branch_name_template: "${{ steps.extract_dw.outputs.dw_branch }}"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}

            issueの内容を確認し、実装計画を立ててから修正を行い、プルリクエストを作成してください。

            ## 第1段階：実装計画の作成
            1. .claude/skills/plan-implementation.md の手順に従って、issueの内容を分析する
            2. 影響範囲を調査し、変更が必要なファイルを特定する
            3. プロジェクトルートに plan.md を作成し、詳細な実装計画を記載する

            ## 第2段階：実装とPR作成
            4. plan.md に従って必要なコード変更を実装する
            5. git add と git commit で変更をコミットする（plan.mdは含めない）
            6. .claude/skills/create-pr.md のテンプレートに従って gh pr create コマンドでPRを作成する（base branchはmain）

            **重要：**
            - plan.md は実装の指針として作成しますが、コミットには含めないでください
            - PRの説明は .claude/skills/create-pr.md のテンプレート形式を使用してください
            - プルリクエストのタイトルや説明は日本語で記述してください
          claude_args: '--allowed-tools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh:*)"'
