name: Claude Code

on:
  issues:
    types: [opened]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Dw number from issue title
        id: extract_dw
        run: |
          TITLE="${{ github.event.issue.title }}"
          # Dw-123 のような形式から抽出（大文字小文字区別なし）
          DW_NUM=$(echo "$TITLE" | grep -oiP '^Dw-\d+' | tr '[:upper:]' '[:lower:]')
          if [ -z "$DW_NUM" ]; then
            echo "dw_branch=issue-${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "dw_branch=$DW_NUM" >> $GITHUB_OUTPUT
          fi

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: "main"
          branch_prefix: "feature/"
          branch_name_template: "${{ steps.extract_dw.outputs.dw_branch }}"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}

            issueの内容を確認し、必要な修正を行い、プルリクエストを作成してください。

            実装手順：
            1. gh issue view コマンドでissueの内容を取得する
            2. 必要なコード変更を実装する
            3. git add と git commit で変更をコミットする
            4. **.claude/skills/create-pr.md のテンプレートに従って gh pr create コマンドでPRを作成する（base branchはmain）**

            プルリクエストのタイトルや説明は日本語で記述してください。
            必ず .claude/skills/create-pr.md のテンプレート形式を使用してください。
          claude_args: '--allowed-tools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh:*)"'
