name: Claude Code

on:
  issues:
    types: [opened]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Dw number from issue title
        id: extract_dw
        run: |
          TITLE="${{ github.event.issue.title }}"
          # Dw-123 のような形式から抽出（大文字小文字区別なし）
          DW_NUM=$(echo "$TITLE" | grep -oiP '^Dw-\d+' | tr '[:upper:]' '[:lower:]')
          if [ -z "$DW_NUM" ]; then
            echo "dw_branch=issue-${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "dw_branch=$DW_NUM" >> $GITHUB_OUTPUT
          fi

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: "main"
          branch_prefix: "feature/"
          branch_name_template: "${{ steps.extract_dw.outputs.dw_branch }}"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}

            このissueに対応するため、commandsを使用して実装してください。

            ## ステップ1: 実装計画の作成（/plan command）
            .claude/commands/plan.md の手順に従って実装計画を作成：
            - issueの内容を分析
            - 影響範囲を調査
            - プロジェクトルートに plan.md を作成

            ## ステップ2: 実装
            plan.md の内容に従って実装：
            - 必要なファイルを編集
            - plan.md と変更したファイルを git add
            - git commit でコミット（plan.mdを含める）

            ## ステップ3: PR作成（/create-pr command）
            .claude/commands/create-pr.md のテンプレートに従ってPR作成：
            - gh pr create でPRを作成（base branch: main）

            **重要な注意事項：**
            - plan.md を必ずコミットに含めること（実行確認のため）
            - PRの本文は .claude/commands/create-pr.md のテンプレート形式を使用
            - プルリクエストのタイトルと説明は日本語で記述
            - セキュリティチェック（XSS対策など）を必ず実施
          claude_args: '--allowed-tools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh:*)"'
