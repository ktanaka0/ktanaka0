name: Claude Code

on:
  issues:
    types: [opened]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: "main"
          branch_prefix: "feature/dw-"
          branch_name_template: "{{prefix}}{{entityNumber}}"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}

            issueの内容を確認し、必要な修正を行い、プルリクエストを作成してください。

            実装手順：
            1. gh issue view コマンドでissueの内容を取得する
            2. 必要なコード変更を実装する
            3. git add と git commit で変更をコミットする
            4. **必ず gh pr create コマンドでPRを作成する（base branchはmain）**

            プルリクエストのタイトルや説明は日本語で記述してください。
          claude_args: '--allowed-tools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh:*)"'
