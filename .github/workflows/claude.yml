name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: "main"
          mcp_config: |
            {
              "mcpServers": {
                "playwright": {
                  "command": "npx",
                  "args": ["@anthropic-ai/mcp-server-playwright@latest"]
                }
              }
            }
          custom_instructions: |
            あなたはこのリポジトリの開発者です。issueの内容を読み、実装してください。

            実装手順：
            1. issueの内容を理解する
            2. 必要なコード変更を実装する
            3. 変更をコミットする
            4. PRを作成する（mainブランチへ）

            実装が完了したら、必ず以下の手順でスクリーンショットを撮影してください：
            1. ローカルサーバーを起動する（python -m http.server 8080）
            2. Playwright MCPを使ってブラウザで http://localhost:8080 を開く
            3. 実装した機能のスクリーンショットを撮影する
            4. スクリーンショットをPRのdescriptionに添付する

            スクリーンショットはMarkdown形式で貼り付けてください：
            ![Screenshot](screenshot.png)
